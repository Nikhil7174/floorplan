[project]
name = "floorplan"
version = "0.1.0"
description = "Dimensioned floor plans from iPhone LiDAR, video, and photos."
readme = "README.md"
authors = [
    { name = "nikhilk-wq", email = "nikhil.k@zynix.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "typer>=0.27.2",
]

[project.scripts]
floorplan = "floorplan.cli:app"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
